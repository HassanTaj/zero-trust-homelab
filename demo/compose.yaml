name: zero-trust-homelab-demo

services:
  gateway:
    image: traefik:v3.7.14
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic/routes.yml
      - --api.dashboard=false
      - --log.level=INFO
    ports:
      - "127.0.0.1:${DEMO_HTTP_PORT:-8081}:80"
    volumes:
      - ./traefik/routes.yml:/etc/traefik/dynamic/routes.yml:ro
    networks:
      - edge
      - admin

  public-app:
    image: traefik/whoami:v1.12.0
    networks:
      - edge

  admin-app:
    image: traefik/whoami:v1.12.0
    networks:
      - admin

  private-client:
    image: curlimages/curl:8.22.0
    profiles: [test]
    entrypoint: ["curl"]
    command: ["--fail", "--show-error", "--silent", "--header", "Host: admin.localhost", "http://gateway/"]
    networks:
      - admin
    depends_on:
      gateway:
        condition: service_started

networks:
  edge:
  admin:
    internal: true
    ipam:
      config:
        - subnet: 198.18.42.0/24
