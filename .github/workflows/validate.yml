name: Validate local demos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public and private route behavior
        run: bash demo/smoke-test.sh
      - name: Check encrypted backup and restore
        run: bash demo/backup/smoke-test.sh
